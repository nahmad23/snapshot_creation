---
# tasks/snapshot_azure.yml
# Called once from create_snapshots.yml when Azure VMs are present in the CSV.
# Expects:
#   azure_vms        - list of Azure VM rows from CSV
#   azure_creds      - dict {subscription_id, tenant, client_id, secret}
#   snap_name        - snapshot name
#   snap_desc        - snapshot description
#   snapshot_results - list accumulating per-source summaries
#
# Flow:
#   1. azure_rm_virtualmachine_info  → get VM location + resource ID
#   2. azure_rm_manageddisk_info     → list disks per resource group;
#                                      match OS disk via managed_by == vm.id
#   3. azure_rm_snapshot             → create snapshot from the OS disk

- name: Get Azure VM info (location and VM resource ID)
  azure.azcollection.azure_rm_virtualmachine_info:
    resource_group:  "{{ item.resource_group }}"
    name:            "{{ item.vm_name }}"
    subscription_id: "{{ azure_creds.subscription_id }}"
    tenant:          "{{ azure_creds.tenant }}"
    client_id:       "{{ azure_creds.client_id }}"
    secret:          "{{ azure_creds.secret }}"
  loop: "{{ azure_vms }}"
  loop_control:
    label: "{{ item.vm_name }}"
  register: az_vm_info
  ignore_errors: true

- name: Get managed disks for each unique resource group
  azure.azcollection.azure_rm_manageddisk_info:
    resource_group:  "{{ item }}"
    subscription_id: "{{ azure_creds.subscription_id }}"
    tenant:          "{{ azure_creds.tenant }}"
    client_id:       "{{ azure_creds.client_id }}"
    secret:          "{{ azure_creds.secret }}"
  loop: "{{ azure_vms | map(attribute='resource_group') | unique | list }}"
  register: az_rg_disks
  ignore_errors: true

- name: DEBUG — show raw disk info keys returned by azure_rm_manageddisk_info
  ansible.builtin.debug:
    msg:
      - "RG result keys : {{ az_rg_disks.results[0].keys() | list }}"
      - "azure_managed_disk count : {{ az_rg_disks.results[0].azure_managed_disk | default([]) | length }}"
      - "disks count              : {{ az_rg_disks.results[0].disks | default([]) | length }}"
      - "First disk keys          : {{ (az_rg_disks.results[0].azure_managed_disk | default(az_rg_disks.results[0].disks | default([])))[0].keys() | list if (az_rg_disks.results[0].azure_managed_disk | default(az_rg_disks.results[0].disks | default([]))) | length > 0 else 'no disks returned' }}"
      - "VM resource ID           : {{ az_vm_info.results[0].vms[0].id | default('N/A') }}"

- name: Build VM-ID-to-OS-disk-ID lookup map
  ansible.builtin.set_fact:
    az_os_disk_map: >-
      {{ az_os_disk_map | default({}) | combine({item.1.managed_by: item.1.id}) }}
  loop: >-
    {{ az_rg_disks.results
       | subelements('azure_managed_disk', skip_missing=True) }}
  when:
    - not (item.0.failed | default(false))
    - item.1.managed_by is defined

- name: DEBUG — show OS disk map built
  ansible.builtin.debug:
    msg:
      - "az_os_disk_map : {{ az_os_disk_map | default({}) }}"
      - "VM id to look up : {{ az_vm_info.results[0].vms[0].id | default('N/A') }}"
      - "Disk found for VM : {{ (az_os_disk_map | default({}))[az_vm_info.results[0].vms[0].id | default('')] | default('NOT FOUND') }}"

- name: Create OS disk snapshot for each Azure VM
  azure.azcollection.azure_rm_snapshot:
    resource_group:  "{{ item.item.resource_group }}"
    name:            "{{ snap_name }}-{{ item.item.vm_name }}"
    location:        "{{ item.vms[0].location }}"
    subscription_id: "{{ azure_creds.subscription_id }}"
    tenant:          "{{ azure_creds.tenant }}"
    client_id:       "{{ azure_creds.client_id }}"
    secret:          "{{ azure_creds.secret }}"
    creation_data:
      create_option: Copy
      source_id:     "{{ (az_os_disk_map | default({}))[item.vms[0].id] }}"
    tags:
      snapshot_name: "{{ snap_name }}"
      source_vm:     "{{ item.item.vm_name }}"
      description:   "{{ snap_desc }}"
  loop: "{{ az_vm_info.results }}"
  loop_control:
    label: "{{ item.item.vm_name }}"
  when:
    - not item.failed
    - item.vms | default([]) | length > 0
    - (az_os_disk_map | default({}))[item.vms[0].id] is defined
  ignore_errors: true
  register: az_snap_results

- name: Warn about VMs where no managed OS disk was found
  ansible.builtin.debug:
    msg: "SKIPPED (no managed OS disk found in resource group): {{ item.item.vm_name }}"
  loop: "{{ az_vm_info.results | default([]) }}"
  loop_control:
    label: "{{ item.item.vm_name }}"
  when:
    - not item.failed
    - item.vms | default([]) | length > 0
    - (az_os_disk_map | default({}))[item.vms[0].id] is not defined

- name: Build Azure snapshot summary
  ansible.builtin.set_fact:
    _az_succeeded: >-
      {{ az_snap_results.results
         | default([])
         | rejectattr('skipped', 'defined')
         | selectattr('failed', 'equalto', false)
         | map(attribute='item.item.vm_name')
         | list }}
    _az_failed: >-
      {{ (az_snap_results.results
          | default([])
          | rejectattr('skipped', 'defined')
          | selectattr('failed', 'equalto', true)
          | map(attribute='item.item.vm_name')
          | list)
         + (az_vm_info.results
            | default([])
            | selectattr('failed', 'equalto', true)
            | map(attribute='item.vm_name')
            | list)
         + (az_vm_info.results
            | default([])
            | selectattr('failed', 'equalto', false)
            | selectattr('vms', 'defined')
            | selectattr('vms', 'equalto', [])
            | map(attribute='item.vm_name')
            | list) }}

- name: Append Azure results to snapshot_results
  ansible.builtin.set_fact:
    snapshot_results: >-
      {{ snapshot_results + [{
           'source':    'Azure',
           'total':     azure_vms | length,
           'succeeded': _az_succeeded,
           'failed':    _az_failed
         }] }}

- name: Azure — snapshot summary
  ansible.builtin.debug:
    msg:
      - "=== Azure VMs — snapshot: '{{ snap_name }}' ==="
      - "  Total VMs : {{ azure_vms | length }}"
      - "  Succeeded : {{ _az_succeeded | length }}"
      - "  Failed    : {{ _az_failed | length }}"
      - "  Failed VMs: {{ _az_failed if _az_failed else 'none' }}"
