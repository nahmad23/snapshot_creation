---
# tasks/snapshot_azure.yml
# Called once from create_snapshots.yml when Azure VMs are present in the CSV.
# Expects:
#   azure_vms        - list of Azure VM rows from CSV
#   azure_creds      - dict {subscription_id, tenant, client_id, secret}
#   snap_name        - snapshot name
#   snap_desc        - snapshot description
#   snapshot_results - list accumulating per-source summaries
#
# For each Azure VM the playbook:
#   1. Queries azure_rm_resource_info (ARM API) to get the full storageProfile
#      including the OS managed disk ID — azure_rm_virtualmachine_info does not
#      return storage_profile in older collection versions.
#   2. Creates an azure_rm_snapshot from that disk.

- name: Get Azure VM details via ARM API (includes storageProfile + managed disk ID)
  azure.azcollection.azure_rm_resource_info:
    resource_group:  "{{ item.resource_group }}"
    provider:        Microsoft.Compute
    resource_type:   virtualMachines
    resource_name:   "{{ item.vm_name }}"
    api_version:     "2023-03-01"
    subscription_id: "{{ azure_creds.subscription_id }}"
    tenant:          "{{ azure_creds.tenant }}"
    client_id:       "{{ azure_creds.client_id }}"
    secret:          "{{ azure_creds.secret }}"
  loop: "{{ azure_vms }}"
  loop_control:
    label: "{{ item.vm_name }}"
  register: az_vm_info
  ignore_errors: true
  no_log: false

- name: Create OS disk snapshot for each Azure VM
  azure.azcollection.azure_rm_snapshot:
    resource_group:  "{{ item.item.resource_group }}"
    name:            "{{ snap_name }}-{{ item.item.vm_name }}"
    location:        "{{ item.response[0].location }}"
    subscription_id: "{{ azure_creds.subscription_id }}"
    tenant:          "{{ azure_creds.tenant }}"
    client_id:       "{{ azure_creds.client_id }}"
    secret:          "{{ azure_creds.secret }}"
    creation_data:
      create_option: Copy
      source_id: "{{ item.response[0].properties.storageProfile.osDisk.managedDisk.id }}"
    tags:
      snapshot_name: "{{ snap_name }}"
      source_vm:     "{{ item.item.vm_name }}"
      description:   "{{ snap_desc }}"
  loop: "{{ az_vm_info.results }}"
  loop_control:
    label: "{{ item.item.vm_name }}"
  when:
    - not item.failed
    - item.response | default([]) | length > 0
    - item.response[0].properties.storageProfile.osDisk.managedDisk.id is defined
  ignore_errors: true
  register: az_snap_results

- name: Warn about Azure VMs skipped due to missing managed disk
  ansible.builtin.debug:
    msg: "SKIPPED (no managed OS disk): {{ item.item.vm_name }}"
  loop: "{{ az_vm_info.results | default([]) }}"
  loop_control:
    label: "{{ item.item.vm_name }}"
  when:
    - not item.failed
    - item.response | default([]) | length > 0
    - item.response[0].properties.storageProfile.osDisk.managedDisk.id is not defined

- name: Build Azure snapshot summary
  ansible.builtin.set_fact:
    _az_succeeded: >-
      {{ az_snap_results.results
         | default([])
         | rejectattr('skipped', 'defined')
         | selectattr('failed', 'equalto', false)
         | map(attribute='item.item.vm_name')
         | list }}
    _az_failed: >-
      {{ (az_snap_results.results
          | default([])
          | rejectattr('skipped', 'defined')
          | selectattr('failed', 'equalto', true)
          | map(attribute='item.item.vm_name')
          | list)
         + (az_vm_info.results
            | default([])
            | selectattr('failed', 'equalto', true)
            | map(attribute='item.vm_name')
            | list)
         + (az_vm_info.results
            | default([])
            | selectattr('failed', 'equalto', false)
            | selectattr('response', 'defined')
            | selectattr('response', 'equalto', [])
            | map(attribute='item.vm_name')
            | list) }}

- name: Append Azure results to snapshot_results
  ansible.builtin.set_fact:
    snapshot_results: >-
      {{ snapshot_results + [{
           'source':    'Azure',
           'total':     azure_vms | length,
           'succeeded': _az_succeeded,
           'failed':    _az_failed
         }] }}

- name: Azure — snapshot summary
  ansible.builtin.debug:
    msg:
      - "=== Azure VMs — snapshot: '{{ snap_name }}' ==="
      - "  Total VMs : {{ azure_vms | length }}"
      - "  Succeeded : {{ _az_succeeded | length }}"
      - "  Failed    : {{ _az_failed | length }}"
      - "  Failed VMs: {{ _az_failed if _az_failed else 'none' }}"
