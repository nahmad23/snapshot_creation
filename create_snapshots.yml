---
# Playbook: create_snapshots.yml
# Reads VM inventory from vm_inventory.csv. vCenter hostnames are taken
# directly from the CSV — no URL prompts. Only credentials and snapshot
# details are asked at runtime.
#
# CSV columns required:
#   vm_name    - VM display name in vCenter
#   datacenter - Datacenter the VM belongs to
#   vcenter    - Hostname or IP of the vCenter that manages this VM

- name: Load CSV inventory and gather credentials
  hosts: localhost
  gather_facts: false

  vars_prompt:
    - name: snapshot_name
      prompt: "Snapshot name"
      private: false
      default: "pre-change-snapshot"

    - name: snapshot_description
      prompt: "Snapshot description"
      private: false
      default: "Automated snapshot before change"

    - name: csv_file
      prompt: "Path to VM inventory CSV file"
      private: false
      default: "vm_inventory.csv"

  tasks:
    - name: Validate CSV file exists
      ansible.builtin.stat:
        path: "{{ csv_file }}"
      register: csv_stat

    - name: Abort if CSV file not found
      ansible.builtin.fail:
        msg: "CSV file '{{ csv_file }}' not found. Please check the path."
      when: not csv_stat.stat.exists

    - name: Load VM inventory from CSV
      community.general.read_csv:
        path: "{{ csv_file }}"
      register: vm_csv

    - name: Validate CSV has required columns
      ansible.builtin.fail:
        msg: >
          CSV is missing required columns. Required: vm_name, datacenter, vcenter.
          Found: {{ vm_csv.list[0].keys() | list }}
      when: >
        vm_csv.list | length == 0 or
        'vm_name' not in vm_csv.list[0] or
        'datacenter' not in vm_csv.list[0] or
        'vcenter' not in vm_csv.list[0]

    - name: Extract unique vCenter hostnames from CSV
      ansible.builtin.set_fact:
        vcenter_hosts: "{{ vm_csv.list | map(attribute='vcenter') | unique | list | sort }}"

    - name: Abort if more than 2 vCenters found
      ansible.builtin.fail:
        msg: >
          Found {{ vcenter_hosts | length }} unique vCenter hosts in CSV: {{ vcenter_hosts }}.
          This playbook supports up to 2 vCenters.
      when: vcenter_hosts | length > 2

    - name: Show vCenters detected in CSV
      ansible.builtin.debug:
        msg:
          - "Detected {{ vcenter_hosts | length }} vCenter(s) in CSV:"
          - "  vCenter 1: {{ vcenter_hosts[0] }}"
          - "  vCenter 2: {{ vcenter_hosts[1] | default('(none)') }}"

    # --- Credentials for vCenter 1 ---
    - name: "Prompt — username for {{ vcenter_hosts[0] }}"
      ansible.builtin.pause:
        prompt: "Username for {{ vcenter_hosts[0] }} (e.g. administrator@vsphere.local)"
      register: vc1_user_input

    - name: "Prompt — password for {{ vcenter_hosts[0] }}"
      ansible.builtin.pause:
        prompt: "Password for {{ vcenter_hosts[0] }}"
        echo: false
      register: vc1_pass_input
      no_log: true

    # --- Credentials for vCenter 2 (only if present in CSV) ---
    - name: "Prompt — username for {{ vcenter_hosts[1] }}"
      ansible.builtin.pause:
        prompt: "Username for {{ vcenter_hosts[1] }} (e.g. administrator@vsphere.local)"
      register: vc2_user_input
      when: vcenter_hosts | length > 1

    - name: "Prompt — password for {{ vcenter_hosts[1] }}"
      ansible.builtin.pause:
        prompt: "Password for {{ vcenter_hosts[1] }}"
        echo: false
      register: vc2_pass_input
      no_log: true
      when: vcenter_hosts | length > 1

    # --- Store everything for downstream plays ---
    - name: Store vCenter 1 credentials
      ansible.builtin.set_fact:
        vc1:
          host: "{{ vcenter_hosts[0] }}"
          user: "{{ vc1_user_input.user_input }}"
          password: "{{ vc1_pass_input.user_input }}"
        cacheable: false

    - name: Store vCenter 2 credentials
      ansible.builtin.set_fact:
        vc2:
          host: "{{ vcenter_hosts[1] }}"
          user: "{{ vc2_user_input.user_input }}"
          password: "{{ vc2_pass_input.user_input }}"
        cacheable: false
      when: vcenter_hosts | length > 1

    - name: Default empty vCenter 2 when not present in CSV
      ansible.builtin.set_fact:
        vc2:
          host: ""
          user: ""
          password: ""
        cacheable: false
      when: vcenter_hosts | length < 2

    - name: Split VMs by vCenter
      ansible.builtin.set_fact:
        vc1_vms: "{{ vm_csv.list | selectattr('vcenter', 'equalto', vcenter_hosts[0]) | list }}"
        vc2_vms: >-
          {{ vm_csv.list | selectattr('vcenter', 'equalto', vcenter_hosts[1]) | list
             if vcenter_hosts | length > 1 else [] }}

    - name: Store snapshot metadata
      ansible.builtin.set_fact:
        snap_name: "{{ snapshot_name }}"
        snap_desc: "{{ snapshot_description }}"
        cacheable: false

    - name: Inventory summary
      ansible.builtin.debug:
        msg:
          - "CSV loaded : {{ vm_csv.list | length }} total VMs"
          - "  {{ vc1.host }}: {{ vc1_vms | length }} VMs"
          - "  {{ vc2.host if vc2.host else '(no second vCenter)' }}: {{ vc2_vms | length }} VMs"

# ---------------------------------------------------------------------------
# vCenter 1
# ---------------------------------------------------------------------------
- name: Create snapshots on vCenter 1
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Skip vCenter 1 if no VMs assigned
      ansible.builtin.debug:
        msg: "No VMs assigned to {{ vc1.host }} in CSV — skipping."
      when: vc1_vms | length == 0

    - name: "Fire async snapshot tasks for {{ vc1.host }} ({{ vc1_vms | length }} VMs)"
      community.vmware.vmware_guest_snapshot:
        hostname: "{{ vc1.host }}"
        username: "{{ vc1.user }}"
        password: "{{ vc1.password }}"
        validate_certs: false
        datacenter: "{{ item.datacenter }}"
        folder: "/{{ item.datacenter }}/vm"
        name: "{{ item.vm_name }}"
        state: present
        snapshot_name: "{{ snap_name }}"
        description: "{{ snap_desc }}"
        memory_dump: false
        quiesce: false
      loop: "{{ vc1_vms }}"
      loop_control:
        label: "{{ item.vm_name }}"
      async: 600
      poll: 0
      ignore_errors: true
      register: vc1_async_jobs
      when: vc1_vms | length > 0

    - name: Wait for all vCenter 1 snapshot jobs to complete
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ vc1_async_jobs.results | default([]) }}"
      loop_control:
        label: "{{ item.item.vm_name }}"
      register: vc1_job_results
      until: vc1_job_results.finished
      retries: 60
      delay: 10
      ignore_errors: true
      when: vc1_vms | length > 0

    - name: Build vCenter 1 summary
      ansible.builtin.set_fact:
        vc1_succeeded: >-
          {{ vc1_job_results.results
             | default([])
             | selectattr('failed', 'equalto', false)
             | map(attribute='item.item.vm_name')
             | list }}
        vc1_failed: >-
          {{ vc1_job_results.results
             | default([])
             | selectattr('failed', 'equalto', true)
             | map(attribute='item.item.vm_name')
             | list }}

    - name: "{{ vc1.host }} — snapshot summary"
      ansible.builtin.debug:
        msg:
          - "=== {{ vc1.host }} — snapshot: '{{ snap_name }}' ==="
          - "  Total VMs : {{ vc1_vms | length }}"
          - "  Succeeded : {{ vc1_succeeded | length }}"
          - "  Failed    : {{ vc1_failed | length }}"
          - "  Failed VMs: {{ vc1_failed if vc1_failed else 'none' }}"

# ---------------------------------------------------------------------------
# vCenter 2
# ---------------------------------------------------------------------------
- name: Create snapshots on vCenter 2
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Skip vCenter 2 if not present in CSV
      ansible.builtin.debug:
        msg: "No second vCenter in CSV — skipping."
      when: vc2.host == '' or vc2_vms | length == 0

    - name: "Fire async snapshot tasks for {{ vc2.host }} ({{ vc2_vms | length }} VMs)"
      community.vmware.vmware_guest_snapshot:
        hostname: "{{ vc2.host }}"
        username: "{{ vc2.user }}"
        password: "{{ vc2.password }}"
        validate_certs: false
        datacenter: "{{ item.datacenter }}"
        folder: "/{{ item.datacenter }}/vm"
        name: "{{ item.vm_name }}"
        state: present
        snapshot_name: "{{ snap_name }}"
        description: "{{ snap_desc }}"
        memory_dump: false
        quiesce: false
      loop: "{{ vc2_vms }}"
      loop_control:
        label: "{{ item.vm_name }}"
      async: 600
      poll: 0
      ignore_errors: true
      register: vc2_async_jobs
      when: vc2.host != '' and vc2_vms | length > 0

    - name: Wait for all vCenter 2 snapshot jobs to complete
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ vc2_async_jobs.results | default([]) }}"
      loop_control:
        label: "{{ item.item.vm_name }}"
      register: vc2_job_results
      until: vc2_job_results.finished
      retries: 60
      delay: 10
      ignore_errors: true
      when: vc2.host != '' and vc2_vms | length > 0

    - name: Build vCenter 2 summary
      ansible.builtin.set_fact:
        vc2_succeeded: >-
          {{ vc2_job_results.results
             | default([])
             | selectattr('failed', 'equalto', false)
             | map(attribute='item.item.vm_name')
             | list }}
        vc2_failed: >-
          {{ vc2_job_results.results
             | default([])
             | selectattr('failed', 'equalto', true)
             | map(attribute='item.item.vm_name')
             | list }}

    - name: "{{ vc2.host }} — snapshot summary"
      ansible.builtin.debug:
        msg:
          - "=== {{ vc2.host }} — snapshot: '{{ snap_name }}' ==="
          - "  Total VMs : {{ vc2_vms | length }}"
          - "  Succeeded : {{ vc2_succeeded | length }}"
          - "  Failed    : {{ vc2_failed | length }}"
          - "  Failed VMs: {{ vc2_failed if vc2_failed else 'none' }}"
      when: vc2.host != ''

# ---------------------------------------------------------------------------
# Combined final report
# ---------------------------------------------------------------------------
- name: Final combined report
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Overall snapshot report
      ansible.builtin.debug:
        msg:
          - "========================================="
          - " SNAPSHOT RUN COMPLETE"
          - "========================================="
          - " Snapshot name : {{ snap_name }}"
          - " CSV inventory : {{ vm_csv.list | length }} VMs total"
          - "-----------------------------------------"
          - " {{ vc1.host }}"
          - "   Total VMs  : {{ vc1_vms | length }}"
          - "   Succeeded  : {{ vc1_succeeded | length }}"
          - "   Failed     : {{ vc1_failed | length }}"
          - " {{ vc2.host if vc2.host else '(no second vCenter)' }}"
          - "   Total VMs  : {{ vc2_vms | length }}"
          - "   Succeeded  : {{ vc2_succeeded | length }}"
          - "   Failed     : {{ vc2_failed | length }}"
          - "-----------------------------------------"
          - " Total succeeded : {{ (vc1_succeeded + vc2_succeeded) | length }}"
          - " Total failed    : {{ (vc1_failed + vc2_failed) | length }}"
          - "========================================="

    - name: List all failed VMs
      ansible.builtin.debug:
        msg: "FAILED: {{ item }}"
      loop: "{{ vc1_failed + vc2_failed }}"
      when: (vc1_failed + vc2_failed) | length > 0

    - name: Fail playbook if any snapshot failed
      ansible.builtin.fail:
        msg: "{{ (vc1_failed + vc2_failed) | length }} VM(s) failed. See list above."
      when: (vc1_failed + vc2_failed) | length > 0
