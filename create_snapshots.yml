---
# Playbook: create_snapshots.yml
# Supports both VMware vCenter VMs and Azure VMs from a single CSV.
# vCenter hostnames and Azure resource groups come from the CSV —
# no infrastructure prompts. Only credentials and snapshot details
# are asked at runtime, and only for the platforms present in the CSV.
#
# CSV columns required:
#   vm_name        - VM display name (must match exactly in vCenter or Azure)
#   platform       - "vcenter" or "azure"
#   datacenter     - vCenter datacenter name  /  Azure region (e.g. eastus)
#   vcenter        - vCenter hostname or IP   /  leave blank for Azure
#   resource_group - leave blank for vCenter  /  Azure resource group name
#
# vCenter credentials are read from environment variables (no prompts):
#   export VCENTER_USERNAME="administrator@vsphere.local"
#   export VCENTER_PASSWORD="your_password"

- name: Load CSV inventory and gather credentials
  hosts: localhost
  gather_facts: false

  vars:
    csv_file: "vm_inventory.csv"

  tasks:
    - name: Validate CSV file exists
      ansible.builtin.stat:
        path: "{{ csv_file }}"
      register: csv_stat

    - name: Abort if CSV file not found
      ansible.builtin.fail:
        msg: "CSV file '{{ csv_file }}' not found. Please check the path."
      when: not csv_stat.stat.exists

    - name: Load VM inventory from CSV
      community.general.read_csv:
        path: "{{ csv_file }}"
      register: vm_csv

    - name: Validate CSV has required columns
      ansible.builtin.fail:
        msg: >
          CSV is missing required columns.
          Required: vm_name, platform, datacenter, vcenter, resource_group.
          Found: {{ vm_csv.list[0].keys() | list }}
      when: >
        vm_csv.list | length == 0 or
        'vm_name'        not in vm_csv.list[0] or
        'platform'       not in vm_csv.list[0] or
        'datacenter'     not in vm_csv.list[0] or
        'vcenter'        not in vm_csv.list[0] or
        'resource_group' not in vm_csv.list[0]

    - name: Split VMs by platform
      ansible.builtin.set_fact:
        vcenter_vms_all: "{{ vm_csv.list | selectattr('platform', 'equalto', 'vcenter') | list }}"
        azure_vms:       "{{ vm_csv.list | selectattr('platform', 'equalto', 'azure')   | list }}"

    - name: Extract unique vCenter hostnames
      ansible.builtin.set_fact:
        vcenter_hosts: "{{ vcenter_vms_all | map(attribute='vcenter') | unique | list | sort }}"

    # -------------------------------------------------------------------------
    # Validate vCenter credentials from environment variables
    # -------------------------------------------------------------------------
    - name: Abort if VCENTER_USERNAME env var is not set
      ansible.builtin.fail:
        msg: >
          VCENTER_USERNAME environment variable is not set.
          Export it before running: export VCENTER_USERNAME="administrator@vsphere.local"
      when:
        - vcenter_vms_all | length > 0
        - lookup('env', 'VCENTER_USERNAME') == ''

    - name: Abort if VCENTER_PASSWORD env var is not set
      ansible.builtin.fail:
        msg: >
          VCENTER_PASSWORD environment variable is not set.
          Export it before running: export VCENTER_PASSWORD="your_password"
      when:
        - vcenter_vms_all | length > 0
        - lookup('env', 'VCENTER_PASSWORD') == ''

    # -------------------------------------------------------------------------
    # Install Azure Python SDK dependencies when Azure VMs are present
    # -------------------------------------------------------------------------
    - name: Find Azure collection requirements file
      ansible.builtin.find:
        paths:
          - "{{ lookup('env', 'HOME') }}/.ansible/collections/ansible_collections/azure/azcollection"
          - /usr/share/ansible/collections/ansible_collections/azure/azcollection
          - /usr/lib/python3/dist-packages/ansible_collections/azure/azcollection
        patterns: "requirements-azure.txt"
        recurse: false
      register: az_req_file
      when: azure_vms | length > 0

    - name: Install Azure Python SDK from requirements file (skip OS-managed packages)
      ansible.builtin.shell: |
        grep -vE "^(argcomplete|packaging|pyparsing|six|python-dateutil|urllib3|certifi|chardet|idna|requests|setuptools|wheel|pip)" \
          "{{ az_req_file.files[0].path }}" | \
          {{ ansible_python_interpreter | default('/usr/bin/python3') }} \
          -m pip install --quiet --break-system-packages --ignore-installed -r /dev/stdin
      args:
        executable: /bin/bash
      when:
        - azure_vms | length > 0
        - az_req_file.files | default([]) | length > 0
      changed_when: true

    - name: Install Azure Python SDK packages (fallback if requirements file not found)
      ansible.builtin.command:
        cmd: >-
          {{ ansible_python_interpreter | default('/usr/bin/python3') }}
          -m pip install --quiet --break-system-packages --ignore-installed
          msrestazure
          azure-cli-core
          "azure-mgmt-compute>=21.0.0"
          "azure-mgmt-resource>=21.0.0"
          "azure-mgmt-network>=19.0.0"
          "azure-mgmt-storage>=19.0.0"
          "azure-mgmt-managementgroups"
          azure-common
          azure-identity
          azure-core
      when:
        - azure_vms | length > 0
        - az_req_file.files | default([]) | length == 0
      changed_when: true

    - name: Show platforms and counts detected in CSV
      ansible.builtin.debug:
        msg:
          - "CSV loaded: {{ vm_csv.list | length }} total VMs"
          - "  VMware vCenter VMs : {{ vcenter_vms_all | length }} across {{ vcenter_hosts | length }} vCenter(s)"
          - "  Azure VMs          : {{ azure_vms | length }}"

    # -------------------------------------------------------------------------
    # Build credential maps
    # -------------------------------------------------------------------------
    - name: Build vCenter credentials map from environment variables
      ansible.builtin.set_fact:
        vcenter_creds: >-
          {{ vcenter_creds | default({}) | combine({
               item: {
                 'host':     item,
                 'user':     lookup('env', 'VCENTER_USERNAME'),
                 'password': lookup('env', 'VCENTER_PASSWORD')
               }
             }) }}
      loop: "{{ vcenter_hosts }}"
      loop_control:
        label: "{{ item }}"
      no_log: true
      when: vcenter_vms_all | length > 0

    # -------------------------------------------------------------------------
    # Azure credentials — prompted only when Azure VMs are present in CSV
    # -------------------------------------------------------------------------
    - name: "Prompt — Azure Subscription ID"
      ansible.builtin.pause:
        prompt: "Azure Subscription ID"
      register: az_sub_input
      when: azure_vms | length > 0

    - name: "Prompt — Azure Tenant ID"
      ansible.builtin.pause:
        prompt: "Azure Tenant ID"
      register: az_tenant_input
      when: azure_vms | length > 0

    - name: "Prompt — Azure Client ID (Service Principal)"
      ansible.builtin.pause:
        prompt: "Azure Client ID (Service Principal)"
      register: az_client_input
      when: azure_vms | length > 0

    - name: "Prompt — Azure Client Secret"
      ansible.builtin.pause:
        prompt: "Azure Client Secret"
        echo: false
      register: az_secret_input
      no_log: true
      when: azure_vms | length > 0

    - name: Build Azure credentials
      ansible.builtin.set_fact:
        azure_creds:
          subscription_id: "{{ az_sub_input.user_input }}"
          tenant:          "{{ az_tenant_input.user_input }}"
          client_id:       "{{ az_client_input.user_input }}"
          secret:          "{{ az_secret_input.user_input }}"
      no_log: true
      when: azure_vms | length > 0

    - name: Build VMs-by-vCenter map
      ansible.builtin.set_fact:
        vms_by_vcenter: >-
          {{ vms_by_vcenter | default({}) | combine({
               item: vcenter_vms_all | selectattr('vcenter', 'equalto', item) | list
             }) }}
      loop: "{{ vcenter_hosts }}"
      when: vcenter_vms_all | length > 0

    - name: Generate snapshot name with timestamp
      ansible.builtin.set_fact:
        snap_name: "Security_{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
        snap_desc: "Security snapshot — {{ lookup('pipe', 'date +%Y-%m-%d %H:%M:%S') }}"
        snapshot_results: []
        cacheable: false

    - name: Show snapshot name that will be used
      ansible.builtin.debug:
        msg: "Snapshot name: {{ snap_name }}"

    - name: Inventory summary
      ansible.builtin.debug:
        msg: >-
          Platforms detected:
          {% if vcenter_hosts | length > 0 %}
          VMware vCenter ({{ vcenter_hosts | length }} vCenter(s)):
          {% for vc in vcenter_hosts %}
            {{ vc }}: {{ vms_by_vcenter[vc] | length }} VMs
          {% endfor %}
          {% endif %}
          {% if azure_vms | length > 0 %}
          Azure: {{ azure_vms | length }} VMs across
          {{ azure_vms | map(attribute='resource_group') | unique | list | length }} resource group(s)
          {% endif %}

# ---------------------------------------------------------------------------
# VMware vCenter snapshots
# ---------------------------------------------------------------------------
- name: Create snapshots on all vCenters
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Process snapshots for each vCenter
      ansible.builtin.include_tasks: tasks/snapshot_vcenter.yml
      loop: "{{ vcenter_hosts | default([]) }}"
      loop_control:
        loop_var: current_vc_host
        label: "{{ current_vc_host }}"
      when: vcenter_hosts | default([]) | length > 0

# ---------------------------------------------------------------------------
# Azure VM snapshots
# ---------------------------------------------------------------------------
- name: Create snapshots for Azure VMs
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Process Azure VM snapshots
      ansible.builtin.include_tasks: tasks/snapshot_azure.yml
      when: azure_vms | default([]) | length > 0

# ---------------------------------------------------------------------------
# Combined final report
# ---------------------------------------------------------------------------
- name: Final combined report
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Per-source snapshot results
      ansible.builtin.debug:
        msg:
          - "=== {{ item.source }} ==="
          - "  Total VMs : {{ item.total }}"
          - "  Succeeded : {{ item.succeeded | length }}"
          - "  Failed    : {{ item.failed | length }}"
          - "  Failed VMs: {{ item.failed if item.failed else 'none' }}"
      loop: "{{ snapshot_results }}"
      loop_control:
        label: "{{ item.source }}"

    - name: Overall snapshot report
      ansible.builtin.debug:
        msg:
          - "========================================="
          - " SNAPSHOT RUN COMPLETE"
          - "========================================="
          - " Snapshot name : {{ snap_name }}"
          - " CSV inventory : {{ vm_csv.list | length }} VMs total"
          - " VMware vCenters: {{ vcenter_hosts | default([]) | length }}"
          - " Azure VMs      : {{ azure_vms | default([]) | length }}"
          - "-----------------------------------------"
          - " Total succeeded : {{ snapshot_results | map(attribute='succeeded') | map('length') | sum }}"
          - " Total failed    : {{ snapshot_results | map(attribute='failed')    | map('length') | sum }}"
          - "========================================="

    - name: List all failed VMs across all sources
      ansible.builtin.debug:
        msg: "FAILED on {{ item.0.source }}: {{ item.1 }}"
      loop: >-
        {{ snapshot_results
           | selectattr('failed', 'ne', [])
           | subelements('failed') }}
      loop_control:
        label: "{{ item.1 }}"
      when: snapshot_results | map(attribute='failed') | map('length') | sum > 0

    - name: Fail playbook if any snapshot failed
      ansible.builtin.fail:
        msg: >-
          {{ snapshot_results | map(attribute='failed') | map('length') | sum }}
          VM(s) failed to snapshot. See list above.
      when: snapshot_results | map(attribute='failed') | map('length') | sum > 0
